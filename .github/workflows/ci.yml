name: Mobile CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: npm run validate
      - run: npx expo export --platform all --output-dir .expo/ci-export
        env:
          EXPO_PUBLIC_API_BASE_URL: https://example.invalid/api
          EXPO_PUBLIC_WS_BASE_URL: wss://example.invalid
          EXPO_PUBLIC_MEDIA_BASE_URL: https://example.invalid
          EXPO_PUBLIC_WEB_BASE_URL: https://example.invalid
